name: Render Full Motion Video

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      duration:
        description: "Video duration in seconds (45-120)"
        required: false
        default: "60"

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (FFmpeg + Raqm/HarfBuzz/FriBiDi)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libharfbuzz-dev libfribidi-dev libraqm-dev

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Render final 1080p60 video
        run: |
          DUR="${{ github.event.inputs.duration || '60' }}"
          python render.py --quality final --duration "$DUR"

      - name: Upload rendered video artifact
        uses: actions/upload-artifact@v4
        with:
          name: motion2-final-video
          path: output/*.mp4
          retention-days: 14
