name: Render Motion Graphics Video

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      quality:
        description: 'Render quality (preview = 720p30, final = 1080p60)'
        required: true
        default: 'final'
        type: choice
        options:
          - preview
          - final

jobs:
  render-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Render Motion Video
        env:
          RENDER_QUALITY: ${{ github.event.inputs.quality || 'final' }}
        run: |
          python render.py --quality "$RENDER_QUALITY"

      - name: Upload Rendered Video as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-motion-video-${{ github.run_number }}
          path: output/*.mp4
          retention-days: 7
